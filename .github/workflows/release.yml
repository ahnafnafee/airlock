name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  # Resolved and checked once, before anything is built. The version is used by
  # the filename, the ldflags and the release tag, and three copies of the same
  # "which event was this" logic is how they come to disagree.
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${INPUT_TAG}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          # The name ends up in a filename and a URL, so it is checked rather
          # than trusted. A branch name reaching this by accident would produce
          # an artifact called airlock_feat/something_linux_amd64.
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a version. Expected vMAJOR.MINOR.PATCH, for example v0.1.0."
            exit 1
          fi

          # Refuse to go backwards or sideways. Publishing a version at or below
          # the newest one already out means whoever downloads "latest" gets
          # something older than the release they just read about.
          latest="$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "No published release yet, so ${version} is the first."
          else
            echo "Newest published release is ${latest}."
            if [ "$version" = "$latest" ]; then
              echo "::error::${version} is already published."
              exit 1
            fi
            highest="$( { echo "${version#v}"; echo "${latest#v}"; } | sort -V | tail -n1 )"
            if [ "$highest" != "${version#v}" ]; then
              echo "::error::${version} is not greater than the published ${latest}."
              exit 1
            fi
          fi

          # sort -V orders a prerelease after its own release, which semver does
          # not, so v1.0.0-rc1 cannot follow v1.0.0 through this check. Say so
          # rather than let the comparison quietly mean something else.
          case "$version" in
            *-*) echo "::notice::${version} is a prerelease. Ordering against other prereleases is by sort -V, not by semver." ;;
          esac

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version}."

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The client ships inside the binary, so a broken client is a broken
      # release with nothing at runtime to catch it.
      - name: Test the client
        run: node --test web/*.test.mjs

      - name: Test the server
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Reproducible across runners: no cgo, no host paths in the binary.
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          name="airlock_${VERSION}_${GOOS}_${GOARCH}${{ matrix.ext }}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${name}" .
          cd dist
          sha256sum "${name}" > "${name}.sha256"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: airlock-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: staged
          merge-multiple: true

      # One file listing every artifact's digest, so a download can be checked
      # without fetching six separate files.
      - name: Collect the checksums
        run: |
          cd staged
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -la

      # The generated notes are a list of commits, which tells someone who
      # already knows the project what changed and tells a first-time downloader
      # nothing. This is the part that says which file to take and how to check
      # it. The commit list is appended below it by generate_release_notes.
      - name: Write the release notes
        env:
          TAG: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cat > NOTES.md <<EOF
          **Airlock** is self-hosted, end-to-end encrypted file transfer between your own
          devices, over your Tailscale network. One binary, an installable web app, no
          accounts and no public port.

          ### Which file do I want

          | Your machine | Download |
          | --- | --- |
          | Linux, most PCs and servers | \`airlock_${TAG}_linux_amd64\` |
          | Linux on a Pi or an ARM VPS | \`airlock_${TAG}_linux_arm64\` |
          | Mac, Apple silicon | \`airlock_${TAG}_darwin_arm64\` |
          | Mac, Intel | \`airlock_${TAG}_darwin_amd64\` |
          | Windows | \`airlock_${TAG}_windows_amd64.exe\` |
          | Windows on ARM | \`airlock_${TAG}_windows_arm64.exe\` |

          ### Getting started

          \`\`\`bash
          curl -LO https://github.com/${REPO}/releases/download/${TAG}/airlock_${TAG}_linux_amd64
          curl -LO https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          chmod +x airlock_${TAG}_linux_amd64
          ./airlock_${TAG}_linux_amd64
          \`\`\`

          It prints the one URL that works. Open it on any device on your tailnet,
          choose a passphrase, and send a file. That is the whole setup.

          **You need** [Tailscale](https://tailscale.com) on at least two devices, and
          [HTTPS certificates enabled](https://tailscale.com/kb/1153/enabling-https) on
          your tailnet. Airlock needs a real certificate because the browser needs a
          secure context: without one there is no Web Crypto and no service worker, and
          the client cannot work at all.

          Setup, options and the security model are in the
          [README](https://github.com/${REPO}#readme).

          ### Verifying a download

          Every binary ships its own \`.sha256\`, and \`SHA256SUMS\` carries all six.

          ---
          EOF
          cat NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          draft: false
          body_path: NOTES.md
          generate_release_notes: true
          files: staged/*
