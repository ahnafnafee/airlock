# Larger UDP buffers let the kernel batch WireGuard datagrams, which is where
# Tailscale's GSO and GRO throughput work pays off. Without these the receive
# path drops under load and throughput collapses well before the link does.
#
# These belong on the machine running tailscaled, which in host mode is the same
# machine as the server and in embedded mode is every client. Apply with:
#
#   sudo cp deploy/sysctl-airlock.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# Confirm with `sysctl net.core.rmem_max`, which must read back the value below,
# and with `journalctl -u tailscaled`, which must stop logging the warning about
# failing to set the UDP receive buffer size.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
