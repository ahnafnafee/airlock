<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
  <rect width="760" height="340" rx="10" fill="#ffffff"/>

  <text x="380" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1e1e">What you are building</text>
  <text x="380" y="63" text-anchor="middle" font-size="14" fill="#757575">No public port, no DNS record, no reverse proxy</text>

  <rect x="24" y="86" width="712" height="200" rx="12" fill="#dbe4ff" fill-opacity="0.35" stroke="#4a9eed" stroke-opacity="0.5"/>
  <text x="42" y="110" font-size="14" fill="#2563eb">Your Tailscale network</text>

  <rect x="52" y="132" width="180" height="60" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="142" y="168" text-anchor="middle" font-size="15" font-weight="600" fill="#12395e">Android phone</text>

  <rect x="52" y="212" width="180" height="60" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="142" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#12395e">Your desktop</text>

  <line x1="240" y1="162" x2="316" y2="186" stroke="#4a9eed" stroke-width="2.5" marker-end="url(#b)"/>
  <line x1="240" y1="242" x2="316" y2="218" stroke="#4a9eed" stroke-width="2.5" marker-end="url(#b)"/>

  <rect x="326" y="150" width="220" height="104" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="436" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#7c4a12">Airlock on the VPS</text>
  <text x="436" y="208" text-anchor="middle" font-size="13.5" fill="#9a5030">in Docker, as its own</text>
  <text x="436" y="228" text-anchor="middle" font-size="13.5" fill="#9a5030">node on your network</text>

  <line x1="554" y1="202" x2="616" y2="202" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#o)"/>

  <rect x="626" y="172" width="102" height="60" rx="10" fill="#c3fae8" stroke="#0e9488" stroke-width="2"/>
  <text x="677" y="197" text-anchor="middle" font-size="13.5" font-weight="600" fill="#115e59">one volume</text>
  <text x="677" y="216" text-anchor="middle" font-size="13.5" fill="#115e59">airlock-data</text>

  <text x="380" y="314" text-anchor="middle" font-size="14" fill="#757575">The container dials out to Tailscale. Nothing dials in from the internet.</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a9eed"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
