<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
  <!-- A white plate rather than a transparent one, because this is read on
       GitHub in both themes and the fills below are light. -->
  <rect width="860" height="470" rx="10" fill="#ffffff"/>

  <text x="430" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#1e1e1e">How a transfer works</text>
  <text x="430" y="70" text-anchor="middle" font-size="15" fill="#757575">Locked on the sending device. The server never gets the key.</text>

  <rect x="20" y="96" width="820" height="238" rx="12" fill="#dbe4ff" fill-opacity="0.35" stroke="#4a9eed" stroke-opacity="0.5"/>
  <text x="38" y="120" font-size="14" fill="#2563eb">Your Tailscale network, which proves who every device is</text>

  <rect x="44" y="142" width="196" height="72" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="142" y="185" text-anchor="middle" font-size="17" font-weight="600" fill="#12395e">Sending device</text>
  <text x="52" y="240" font-size="14" fill="#2563eb">1. split into pieces</text>
  <text x="52" y="262" font-size="14" fill="#2563eb">2. fingerprint each one</text>
  <text x="52" y="284" font-size="14" fill="#2563eb">3. lock with your key</text>

  <line x1="248" y1="178" x2="322" y2="178" stroke="#22c55e" stroke-width="2.5" marker-end="url(#tip)"/>
  <text x="285" y="168" text-anchor="middle" font-size="14" fill="#15803d">upload</text>

  <rect x="332" y="132" width="196" height="92" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="185" text-anchor="middle" font-size="17" font-weight="600" fill="#7c4a12">Airlock server</text>
  <text x="340" y="240" font-size="14" fill="#9a5030">holds scrambled data</text>
  <text x="340" y="262" font-size="14" fill="#9a5030">and opaque ids</text>
  <text x="340" y="284" font-size="14" font-weight="600" fill="#dc2626">never has the key</text>

  <line x1="536" y1="178" x2="610" y2="178" stroke="#22c55e" stroke-width="2.5" marker-end="url(#tip)"/>
  <text x="573" y="168" text-anchor="middle" font-size="14" fill="#15803d">fetch</text>

  <rect x="620" y="142" width="196" height="72" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text x="718" y="185" text-anchor="middle" font-size="17" font-weight="600" fill="#14532d">Receiving device</text>
  <text x="628" y="240" font-size="14" fill="#15803d">4. verify every piece</text>
  <text x="628" y="262" font-size="14" fill="#15803d">5. unlock with your key</text>
  <text x="628" y="284" font-size="14" fill="#15803d">6. save the file</text>

  <rect x="180" y="362" width="500" height="70" rx="10" fill="#fff3bf" fill-opacity="0.75" stroke="#f59e0b" stroke-opacity="0.6"/>
  <text x="430" y="390" text-anchor="middle" font-size="14.5" fill="#7c4a12">The server is asked which fingerprints it already has.</text>
  <text x="430" y="412" text-anchor="middle" font-size="14.5" fill="#7c4a12">That one question is what makes dedup, delta sync and resume work.</text>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>
</svg>
